name: Clean30 Intuitiveness Consolidation

on:
  push:
    branches:
      - redesign/intuitiveness-consolidation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: redesign/intuitiveness-consolidation
          fetch-depth: 0

      - name: Apply update
        run: python scripts/apply-intuitiveness-consolidation.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify update
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify:release-candidate > intuitiveness-verify.log 2>&1
          status=$?
          set -e
          cat intuitiveness-verify.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Publish failure log
        if: steps.verify.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intuitiveness-verify.log
          git commit -m "Capture intuitiveness verification failure"
          git push origin HEAD:redesign/intuitiveness-consolidation
          exit 1

      - name: Commit update
        if: steps.verify.outputs.status == '0'
        run: |
          rm -f intuitiveness-verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Unify Clean30 around one cleaning flow"
          git push origin HEAD:redesign/intuitiveness-consolidation
