name: Clean30 Phase 20 Consolidation

on:
  push:
    branches:
      - phase20/intuitiveness-consolidation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: phase20/intuitiveness-consolidation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply consolidation patch
        run: python scripts/phase20-consolidation.py

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: npm run verify:release-candidate

      - name: Commit Phase 20
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Complete Phase 20 intuitiveness consolidation"
          git push origin HEAD:phase20/intuitiveness-consolidation
