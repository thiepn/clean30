name: Clean30 Autopilot Phase 1 Test Migration v2

on:
  push:
    branches:
      - redesign/autopilot-core
    paths:
      - .github/workflows/autopilot-phase1-test-migration-v2.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: redesign/autopilot-core
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Update intentional schema/runtime contracts
        run: python scripts/update-autopilot-phase1-tests.py

      - run: npm ci
      - run: npm run audit:release
      - run: npm test
      - run: npm run build
      - run: npm run verify:release
      - run: npm run verify:runtime
      - run: node --check public/sw.js

      - name: Commit verified migration contracts
        run: |
          git config user.name "Clean30 Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests scripts/verify-runtime.mjs
          git commit -m "Update regressions for maintenance schema v4"
          git push origin HEAD:redesign/autopilot-core
