name: Apply Clean30 Phase 3 Audit Fix

on:
  push:
    branches:
      - redesign/universal-clean30
    paths:
      - .github/workflows/apply-phase3.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/universal-clean30
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply audit correction
        run: node scripts/fix-phase3-audit.mjs

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check service worker
        run: node --check public/sw.js

      - name: Commit corrected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Phase 3 template-aware routine state"
          git push origin HEAD:redesign/universal-clean30
