name: Clean30 Final Audit Autofix

on:
  push:
    branches:
      - redesign/friction-elimination

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: redesign/friction-elimination
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply final audit fixes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, got {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, flags=re.S):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one regex match in {path}, got {count}: {pattern[:120]!r}")
              write(path, updated)

          # Shared duration parsing: task estimates must understand minutes, ranges, and hours.
          write("src/utils/duration.js", '''function average(first, second = first) {
            return (Number(first) + Number(second)) / 2;
          }

          export function parseDurationMinutes(value, fallback = null) {
            const raw = String(value || "").trim().toLowerCase();
            if (!raw) return fallback;

            const hourRange = raw.match(
              /(\d+(?:\.\d+)?)\s*(?:[-–]\s*(\d+(?:\.\d+)?))?\s*(?:hours?|hrs?|hr|h)\b/i
            );
            if (hourRange) {
              let minutes = average(hourRange[1], hourRange[2] || hourRange[1]) * 60;
              if (!hourRange[2]) {
                const tail = raw.slice((hourRange.index || 0) + hourRange[0].length);
                const minutePart = tail.match(/(\d+(?:\.\d+)?)\s*(?:minutes?|mins?|min|m)\b/i);
                if (minutePart) minutes += Number(minutePart[1]);
              }
              return Number.isFinite(minutes) && minutes > 0 ? Math.max(1, Math.round(minutes)) : fallback;
            }

            const minuteRange = raw.match(
              /(\d+(?:\.\d+)?)\s*(?:[-–]\s*(\d+(?:\.\d+)?))?\s*(?:minutes?|mins?|min|m)\b/i
            );
            if (minuteRange) {
              const minutes = average(minuteRange[1], minuteRange[2] || minuteRange[1]);
              return Number.isFinite(minutes) && minutes > 0 ? Math.max(1, Math.round(minutes)) : fallback;
            }

            const numbers = raw.match(/\d+(?:\.\d+)?/g)?.map(Number).filter(Number.isFinite) || [];
            if (!numbers.length) return fallback;
            const minutes = numbers.length > 1 ? average(numbers[0], numbers[1]) : numbers[0];
            return minutes > 0 ? Math.max(1, Math.round(minutes)) : fallback;
          }
          '''.replace("          ", ""))

          # Routine builder: room-scoped dedupe, accurate duration parsing, and correct drag/drop behavior.
          replace_once(
              "src/utils/routineLibrary.js",
              'import { cleaningTaskCatalog, routineStarterTemplates } from "../data/taskSuggestions.js";\nimport { createId, normalizeRoutine } from "./templateUtils.js";',
              'import { cleaningTaskCatalog, routineStarterTemplates } from "../data/taskSuggestions.js";\nimport { parseDurationMinutes } from "./duration.js";\nimport { createId, normalizeRoutine } from "./templateUtils.js";'
          )
          sub_once(
              "src/utils/routineLibrary.js",
              r'function parseMinutes\(value, fallback = null\) \{.*?\n\}\n\nfunction stageForTitle',
              'function stageForTitle'
          )
          replace_once(
              "src/utils/routineLibrary.js",
              '''function normalizedTitle(value) {
            return String(value || "").trim().toLowerCase();
          }
          '''.replace("          ", ""),
              '''function normalizedTitle(value) {
            return String(value || "").trim().toLowerCase();
          }

          const GLOBAL_TASK_SECTION_NAMES = new Set(["tasks", "whole home"]);

          function sectionScope(sectionTitle) {
            const key = normalizedTitle(sectionTitle);
            return !key || GLOBAL_TASK_SECTION_NAMES.has(key) ? "__global__" : key;
          }

          function scopedTaskKey(sectionTitle, taskTitle) {
            return `${sectionScope(sectionTitle)}::${normalizedTitle(taskTitle)}`;
          }
          '''.replace("          ", "")
          )
          sub_once(
              "src/utils/routineLibrary.js",
              r'export function parseRoutineTaskText\(text\) \{.*?\n\}\n\nexport function appendParsedTaskText',
              '''export function parseRoutineTaskText(text) {
            const sections = [];
            let current = { title: "Tasks", tasks: [] };
            let sawHeading = false;
            const seen = new Set();

            function pushCurrent() {
              if (!current.tasks.length) return;
              sections.push(current);
              current = { title: "Tasks", tasks: [] };
            }

            for (const rawLine of String(text || "").split(/\\r?\\n/)) {
              if (isHeadingLine(rawLine)) {
                pushCurrent();
                current = { title: headingText(rawLine), tasks: [] };
                sawHeading = true;
                continue;
              }
              const title = cleanTaskLine(rawLine);
              if (!title) continue;
              const key = scopedTaskKey(current.title, title);
              if (seen.has(key)) continue;
              seen.add(key);
              current.tasks.push(title);
            }
            pushCurrent();

            return {
              sections,
              taskCount: sections.reduce((total, section) => total + section.tasks.length, 0),
              hasHeadings: sawHeading
            };
          }

          export function appendParsedTaskText'''.replace("          ", "")
          )
          sub_once(
              "src/utils/routineLibrary.js",
              r'export function appendParsedTaskText\(draft, text\) \{.*?\n\}\n\nexport function estimateTaskMinutes',
              '''export function appendParsedTaskText(draft, text) {
            const parsed = parseRoutineTaskText(text);
            if (!parsed.taskCount) return draft;
            const next = createRoutineEditorDraft(draft);
            const existingKeys = new Set(
              next.phases.flatMap((phase) =>
                phase.tasks
                  .map((task) => scopedTaskKey(phase.title, task.title))
                  .filter((key) => !key.endsWith("::"))
              )
            );

            if (!parsed.hasHeadings) {
              const target = next.phases[0] || { id: createId("phase"), title: "Tasks", tasks: [] };
              if (!next.phases.length) next.phases.push(target);
              for (const title of parsed.sections.flatMap((section) => section.tasks)) {
                const key = scopedTaskKey(target.title, title);
                if (existingKeys.has(key)) continue;
                existingKeys.add(key);
                target.tasks.push(createTaskFromTitle(title));
              }
              return next;
            }

            for (const section of parsed.sections) {
              let target = next.phases.find(
                (phase) => normalizedTitle(phase.title) === normalizedTitle(section.title)
              );
              if (!target) {
                if (
                  next.phases.length === 1 &&
                  isDefaultEmptySection(next.phases[0]) &&
                  normalizedTitle(next.phases[0].title) === "tasks"
                ) {
                  target = next.phases[0];
                  target.title = section.title;
                } else {
                  target = { id: createId("phase"), title: section.title, tasks: [] };
                  next.phases.push(target);
                }
              }
              for (const title of section.tasks) {
                const key = scopedTaskKey(target.title, title);
                if (existingKeys.has(key)) continue;
                existingKeys.add(key);
                target.tasks.push(createTaskFromTitle(title));
              }
            }
            return next;
          }

          export function estimateTaskMinutes'''.replace("          ", "")
          )
          replace_once(
              "src/utils/routineLibrary.js",
              '  const direct = parseMinutes(task?.duration, null);',
              '  const direct = parseDurationMinutes(task?.duration, null);'
          )
          sub_once(
              "src/utils/routineLibrary.js",
              r'export function addSuggestedTaskToDraft\(draft, suggestion, phaseId = null\) \{.*?\n\}\n\nexport function optimizeRoutineTaskOrder',
              '''export function addSuggestedTaskToDraft(draft, suggestion, phaseId = null) {
            const title = typeof suggestion === "string" ? suggestion : suggestion?.title;
            if (!String(title || "").trim()) return draft;
            const room = typeof suggestion === "object" ? String(suggestion?.room || "").trim() : "";
            const next = createRoutineEditorDraft(draft);

            let target = phaseId ? next.phases.find((phase) => phase.id === phaseId) : null;
            if (!target && room) {
              const desiredTitle = room === "Whole home" ? "Tasks" : room;
              target = next.phases.find(
                (phase) => normalizedTitle(phase.title) === normalizedTitle(desiredTitle)
              );
              if (!target && next.phases.length === 1 && isDefaultEmptySection(next.phases[0])) {
                target = next.phases[0];
                target.title = desiredTitle;
              }
              if (!target) {
                target = { id: createId("phase"), title: desiredTitle || "Tasks", tasks: [] };
                next.phases.push(target);
              }
            }
            target ||= next.phases[0];
            if (!target) {
              target = { id: createId("phase"), title: "Tasks", tasks: [] };
              next.phases.push(target);
            }

            const key = scopedTaskKey(target.title, title);
            if (
              next.phases.some((phase) =>
                phase.tasks.some(
                  (task) => scopedTaskKey(phase.title, task.title) === key
                )
              )
            ) {
              return next;
            }
            target.tasks.push(createTaskFromTitle(String(title).trim()));
            return next;
          }

          export function optimizeRoutineTaskOrder'''.replace("          ", "")
          )
          replace_once(
              "src/utils/routineLibrary.js",
              'export function createRoutineDraftFromTemplate(templateId) {',
              '''export function moveRoutineTaskByDrop(draft, draggedTask, targetPhaseId, targetTaskId) {
            if (!draggedTask?.phaseId || !draggedTask?.taskId || !targetPhaseId || !targetTaskId) {
              return draft;
            }
            const next = createRoutineEditorDraft(draft);
            const sourcePhase = next.phases.find((phase) => phase.id === draggedTask.phaseId);
            const targetPhase = next.phases.find((phase) => phase.id === targetPhaseId);
            if (!sourcePhase || !targetPhase) return draft;

            const sourceIndex = sourcePhase.tasks.findIndex((task) => task.id === draggedTask.taskId);
            const targetIndexBefore = targetPhase.tasks.findIndex((task) => task.id === targetTaskId);
            if (sourceIndex < 0 || targetIndexBefore < 0) return draft;
            if (sourcePhase.id === targetPhase.id && draggedTask.taskId === targetTaskId) return next;

            const [task] = sourcePhase.tasks.splice(sourceIndex, 1);
            let targetIndex = targetPhase.tasks.findIndex((item) => item.id === targetTaskId);
            if (targetIndex < 0) targetIndex = targetPhase.tasks.length;
            if (sourcePhase.id === targetPhase.id && sourceIndex < targetIndexBefore) {
              targetIndex += 1;
            }
            targetPhase.tasks.splice(targetIndex, 0, task);
            return next;
          }

          export function createRoutineDraftFromTemplate(templateId) {'''.replace("          ", "")
          )

          # Home/Task Library: canonical rooms, reserved-name safety, user-task precedence, and room-aware dedupe.
          write("src/utils/homeLibrary.js", '''import { cleaningTaskCatalog } from "../data/taskSuggestions.js";
          import { parseDurationMinutes } from "./duration.js";
          import { createId } from "./templateUtils.js";
          import { createSimpleRoutineDraft, estimateRoutineMinutes } from "./routineLibrary.js";

          const UTILITY_ZONE_NAMES = new Set(["floors", "other"]);
          const VIRTUAL_ROOM_NAMES = new Set(["all", "whole home"]);
          const GENERIC_SECTION_NAMES = new Set([
            "tasks",
            "task",
            "start",
            "finish",
            "final check",
            "surfaces",
            "floors",
            "daily maintenance",
            "minimum line",
            "today defaults"
          ]);

          export const homeRoomPresets = [
            { name: "Kitchen", description: "Dishes, counters, appliances, floor" },
            { name: "Bathroom", description: "Toilet, sink, mirror, shower or bath" },
            { name: "Bedroom", description: "Bed, clothes, furniture, floor" },
            { name: "Living room", description: "Clutter, sofa, surfaces, floor" },
            { name: "Entrance", description: "Shoes, entry surfaces, floor" },
            { name: "Office", description: "Desk, electronics, shelves, floor" },
            { name: "Dining room", description: "Table, chairs, surfaces, floor" },
            { name: "Laundry", description: "Laundry area, machine, baskets" },
            { name: "Balcony", description: "Furniture, railing, outdoor floor" }
          ];

          function normalized(value) {
            return String(value || "").trim().toLowerCase();
          }

          export function getCanonicalHomeRoomName(value) {
            const name = String(value || "").trim();
            if (!name) return "";
            return homeRoomPresets.find((preset) => normalized(preset.name) === normalized(name))?.name || name;
          }

          export function isReservedHomeRoomName(value) {
            const key = normalized(value);
            return UTILITY_ZONE_NAMES.has(key) || VIRTUAL_ROOM_NAMES.has(key);
          }

          function roomNameFromZone(zone) {
            return typeof zone === "string" ? zone.trim() : String(zone?.name || "").trim();
          }

          function uniqueNames(values = []) {
            const seen = new Set();
            const result = [];
            for (const value of values) {
              const name = String(value || "").trim();
              const key = normalized(name);
              if (!name || seen.has(key)) continue;
              seen.add(key);
              result.push(name);
            }
            return result;
          }

          function catalogTaskForTitle(title) {
            return cleaningTaskCatalog.find((item) => normalized(item.title) === normalized(title)) || null;
          }

          export function getHomeRoomNames(zones = []) {
            return uniqueNames(
              (Array.isArray(zones) ? zones : [])
                .map(roomNameFromZone)
                .map(getCanonicalHomeRoomName)
                .filter((name) => name && !isReservedHomeRoomName(name))
            );
          }

          export function mergeHomeRoomsWithZones(currentZones = [], roomNames = []) {
            const current = Array.isArray(currentZones) ? currentZones : [];
            const existingByName = new Map(
              current
                .map((zone) => {
                  const name = roomNameFromZone(zone);
                  return [normalized(name), typeof zone === "string" ? null : zone];
                })
                .filter(([key]) => key)
            );
            const utilityNames = current
              .map(roomNameFromZone)
              .filter((name) => UTILITY_ZONE_NAMES.has(normalized(name)));
            const safeRooms = uniqueNames(
              (Array.isArray(roomNames) ? roomNames : [])
                .map(getCanonicalHomeRoomName)
                .filter((name) => name && !isReservedHomeRoomName(name))
            );

            return uniqueNames([...safeRooms, ...utilityNames]).map((name) => {
              const existing = existingByName.get(normalized(name));
              return { id: existing?.id || createId("zone"), name };
            });
          }

          function inferTaskRoom(task, phaseTitle, homeRooms) {
            const phase = String(phaseTitle || "").trim();
            const homeMatch = homeRooms.find((room) => normalized(room) === normalized(phase));
            if (homeMatch) return homeMatch;
            if (phase && !GENERIC_SECTION_NAMES.has(normalized(phase)) && !isReservedHomeRoomName(phase)) {
              return getCanonicalHomeRoomName(phase);
            }

            const suggestion = catalogTaskForTitle(task?.title);
            if (suggestion) {
              return homeRooms.find((room) => normalized(room) === normalized(suggestion.room)) || suggestion.room;
            }
            return "Other";
          }

          function routineTaskItems(routines = [], homeRooms = []) {
            const items = [];
            for (const routine of Array.isArray(routines) ? routines : []) {
              if (routine.id === "daily-rules" || routine.archived) continue;
              for (const phase of routine.phases || []) {
                for (const task of phase.tasks || []) {
                  const title = String(task?.title || "").trim();
                  if (!title) continue;
                  const room = inferTaskRoom(task, phase.title, homeRooms);
                  const suggestion = catalogTaskForTitle(title);
                  items.push({
                    id: `routine:${routine.id}:${task.id}`,
                    title,
                    room,
                    minutes: parseDurationMinutes(task.duration, 3),
                    stage: suggestion?.stage ?? 55,
                    keywords: [routine.title, phase.title, ...(suggestion?.keywords || [])].filter(Boolean),
                    source: "routine",
                    sourceLabel: routine.title,
                    recommended: Boolean(suggestion && normalized(suggestion.room) === normalized(room))
                  });
                }
              }
            }
            return items;
          }

          function builtInTaskItems() {
            return cleaningTaskCatalog.map((task, index) => ({
              ...task,
              id: `catalog:${index}:${normalized(task.room)}:${normalized(task.title)}`,
              source: "catalog",
              sourceLabel: "Clean30 suggestions",
              recommended: true
            }));
          }

          export function getHomeLibraryRooms(homeRooms = [], routines = []) {
            const configured = uniqueNames(
              homeRooms.map(getCanonicalHomeRoomName).filter((room) => room && !isReservedHomeRoomName(room))
            );
            const inferred = routineTaskItems(routines, configured)
              .map((item) => item.room)
              .filter((room) => room && !isReservedHomeRoomName(room));
            return uniqueNames(["All", "Whole home", ...configured, ...inferred, "Other"]);
          }

          export function getTaskLibraryItems({ routines = [], homeRooms = [], room = "All", query = "", extraItems = [] } = {}) {
            const configured = uniqueNames(
              homeRooms.map(getCanonicalHomeRoomName).filter((name) => name && !isReservedHomeRoomName(name))
            );
            const configuredByKey = new Map(configured.map((name) => [normalized(name), name]));
            const allowedRoomKeys = new Set(["whole home", "other", ...configuredByKey.keys()]);
            const builtIns = builtInTaskItems()
              .filter((item) => !configured.length || allowedRoomKeys.has(normalized(item.room)))
              .map((item) => ({ ...item, room: configuredByKey.get(normalized(item.room)) || item.room }));
            const routineItems = routineTaskItems(routines, configured);
            const combined = [...extraItems, ...routineItems, ...builtIns];
            const deduped = [];
            const indexByKey = new Map();

            for (const item of combined) {
              const title = String(item?.title || "").trim();
              const itemRoom = getCanonicalHomeRoomName(item?.room || "Other") || "Other";
              if (!title) continue;
              const key = `${normalized(itemRoom)}::${normalized(title)}`;
              const existingIndex = indexByKey.get(key);
              if (existingIndex !== undefined) {
                const existing = deduped[existingIndex];
                if (existing.source !== "catalog" && item.source === "catalog") {
                  existing.recommended = true;
                  existing.stage = item.stage ?? existing.stage;
                  existing.keywords = [...new Set([...(existing.keywords || []), ...(item.keywords || [])])];
                }
                continue;
              }
              indexByKey.set(key, deduped.length);
              deduped.push({
                ...item,
                id: item.id || createId("library-task"),
                title,
                room: itemRoom,
                minutes: Math.max(1, Math.round(Number(item.minutes) || 3)),
                source: item.source || "custom",
                sourceLabel: item.sourceLabel || "Custom task",
                recommended: Boolean(item.recommended)
              });
            }

            const needle = normalized(query);
            const roomKey = normalized(room);
            return deduped
              .filter((item) => roomKey === "all" || normalized(item.room) === roomKey)
              .filter((item) => {
                if (!needle) return true;
                return [item.title, item.room, item.sourceLabel, ...(item.keywords || [])]
                  .join(" ")
                  .toLowerCase()
                  .includes(needle);
              })
              .sort((first, second) => {
                if (first.room !== second.room) return first.room.localeCompare(second.room);
                if (first.recommended !== second.recommended) return first.recommended ? -1 : 1;
                return first.title.localeCompare(second.title);
              });
          }

          export function getRecommendedTaskIdsForRoom(room, homeRooms = [], routines = []) {
            if (!room || normalized(room) === "all" || normalized(room) === "other") return [];
            return getTaskLibraryItems({ routines, homeRooms, room })
              .filter((item) => item.recommended)
              .sort((first, second) => (first.stage || 55) - (second.stage || 55))
              .slice(0, normalized(room) === "whole home" ? 7 : 10)
              .map((item) => item.id);
          }

          export function getSuggestedTaskCountForRoom(room) {
            return cleaningTaskCatalog.filter((item) => normalized(item.room) === normalized(room)).length;
          }

          export function createCustomLibraryItem(title, room = "Other") {
            const cleanTitle = String(title || "").trim();
            if (!cleanTitle) return null;
            return {
              id: createId("library-custom"),
              title: cleanTitle,
              room: getCanonicalHomeRoomName(room) || "Other",
              minutes: 3,
              stage: 55,
              keywords: [],
              source: "custom",
              sourceLabel: "Custom task",
              recommended: false
            };
          }

          export function createRoutineDraftFromLibraryItems(items = []) {
            const unique = [];
            const seen = new Set();
            for (const item of items) {
              const title = String(item?.title || "").trim();
              const room = getCanonicalHomeRoomName(item?.room || "Other") || "Other";
              if (!title) continue;
              const key = `${normalized(room)}::${normalized(title)}`;
              if (seen.has(key)) continue;
              seen.add(key);
              unique.push({ ...item, title, room });
            }

            const draft = createSimpleRoutineDraft();
            if (!unique.length) return draft;

            const groups = new Map();
            for (const item of unique) {
              if (!groups.has(item.room)) groups.set(item.room, []);
              groups.get(item.room).push(item);
            }

            const onlyRoom = groups.size === 1 ? [...groups.keys()][0] : "";
            draft.title = onlyRoom && onlyRoom !== "Whole home" && onlyRoom !== "Other" ? `${onlyRoom} clean` : "My clean";
            draft.phases = [...groups.entries()].map(([roomName, roomItems]) => ({
              id: createId("phase"),
              title: roomName === "Whole home" ? "Tasks" : roomName,
              tasks: roomItems.map((item) => ({
                id: createId("task"),
                title: item.title,
                duration: `${Math.max(1, Math.round(Number(item.minutes) || 3))} min`,
                detail: "",
                note: "",
                tags: [],
                priority: "normal"
              }))
            }));
            const minutes = estimateRoutineMinutes(draft);
            draft.estimatedMinutes = minutes;
            draft.estimatedTime = `${minutes} min`;
            return draft;
          }
          '''.replace("          ", ""))

          # Quick Clean: keep same-named tasks when they belong to different rooms and scope history by template.
          text = read("src/utils/quickClean.js")
          text = text.replace('function dedupeByTitle(items = []) {', 'function dedupeByRoomAndTitle(items = []) {')
          text = text.replace('const key = normalized(item?.title);', 'const key = `${normalized(item?.room)}::${normalized(item?.title)}`;')
          text = text.replace('const candidates = dedupeByTitle(', 'const candidates = dedupeByRoomAndTitle(')
          text = text.replace('  currentDateKey\n} = {}) {', '  currentDateKey,\n  templateId = ""\n} = {}) {')
          text = text.replace('    currentDateKey\n  });', '    currentDateKey,\n    templateId\n  });')
          write("src/utils/quickClean.js", text)

          # Room care: explicit template identity prevents same routine IDs in another plan from contaminating guidance.
          text = read("src/utils/roomCare.js")
          text = text.replace(
              'export function getLastFullRoomRoutineCompletion(room, routines = [], history = []) {',
              'export function getLastFullRoomRoutineCompletion(room, routines = [], history = [], templateId = "") {'
          )
          text = text.replace(
              '          routineIds.has(entry?.routineId) &&\n          Number(entry?.percent) >= 100 &&',
              '          routineIds.has(entry?.routineId) &&\n          (!templateId || !entry?.templateId || entry.templateId === templateId) &&\n          Number(entry?.percent) >= 100 &&'
          )
          text = text.replace(
              '  currentDateKey = getTodayKey()\n} = {}) {',
              '  currentDateKey = getTodayKey(),\n  templateId = ""\n} = {}) {'
          )
          text = text.replace(
              '  const lastCompletedAt = getLastFullRoomRoutineCompletion(room, routines, history);',
              '  const lastCompletedAt = getLastFullRoomRoutineCompletion(room, routines, history, templateId);'
          )
          text = text.replace(
              '  currentDateKey = getTodayKey()\n} = {}) {',
              '  currentDateKey = getTodayKey(),\n  templateId = ""\n} = {}) {'
          )
          text = text.replace(
              '      getRoomCareStatus({ room, routines, history, currentDateKey })',
              '      getRoomCareStatus({ room, routines, history, currentDateKey, templateId })'
          )
          write("src/utils/roomCare.js", text)

          # Home setup: canonicalize preset casing and reject virtual/utility room names that disappear after save.
          replace_once(
              "src/components/HomeRoomsDialog.jsx",
              'import { homeRoomPresets } from "../utils/homeLibrary.js";',
              'import {\n  getCanonicalHomeRoomName,\n  homeRoomPresets,\n  isReservedHomeRoomName\n} from "../utils/homeLibrary.js";'
          )
          sub_once(
