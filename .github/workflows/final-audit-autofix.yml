name: Clean30 Final Audit Autofix

on:
  push:
    branches:
      - redesign/friction-elimination

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: redesign/friction-elimination
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Recover and run audit patcher
        run: |
          git show b24eabe7a8da84de1d87fd9bfc152ae8260a8c51:.github/workflows/final-audit-autofix.yml > /tmp/final-audit-original.yml
          sed -n "/python <<'PY'/,/^          PY$/p" /tmp/final-audit-original.yml | sed '1d;$d;s/^          //' > /tmp/final-audit-fix.py
          python /tmp/final-audit-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Verify patched release candidate
        run: npm run verify:release-candidate

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts tests .github/workflows/deploy.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix final release audit regressions"
          git push origin HEAD:redesign/friction-elimination
