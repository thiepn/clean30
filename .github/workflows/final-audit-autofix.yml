name: Clean30 Final Audit Autofix

on:
  push:
    branches:
      - redesign/friction-elimination

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: redesign/friction-elimination
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply final audit fixes
        run: |
          if [ -f scripts/final-audit-fix.py ]; then
            python scripts/final-audit-fix.py
          else
            echo "Final audit patch script is not present yet."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify patched release candidate
        run: npm run verify:release-candidate

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/verify-runtime.mjs tests
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix final release audit regressions"
          git push origin HEAD:redesign/friction-elimination
