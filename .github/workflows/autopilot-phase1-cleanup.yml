name: Clean30 Autopilot Phase 1 Cleanup

on:
  push:
    branches:
      - redesign/autopilot-core
    paths:
      - .github/workflows/autopilot-phase1-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: redesign/autopilot-core
          fetch-depth: 0

      - name: Remove temporary migration tooling
        run: |
          rm -f \
            .github/workflows/autopilot-phase1-apply.yml \
            .github/workflows/autopilot-phase1-apply-v2.yml \
            .github/workflows/autopilot-phase1-verify.yml \
            .github/workflows/autopilot-phase1-test-migration.yml \
            .github/workflows/autopilot-phase1-test-migration-v2.yml \
            .github/workflows/autopilot-phase1-cleanup.yml \
            scripts/apply-autopilot-phase1.mjs \
            scripts/apply-autopilot-phase1.py \
            scripts/update-autopilot-phase1-tests.py

      - name: Commit cleanup
        run: |
          git config user.name "Clean30 Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Phase 1 migration tooling"
          git push origin HEAD:redesign/autopilot-core
