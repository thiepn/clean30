name: Clean30 Autopilot Phase 1 Apply

on:
  push:
    branches:
      - redesign/autopilot-core
    paths:
      - .github/workflows/autopilot-phase1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: redesign/autopilot-core
          fetch-depth: 0

      - name: Apply Phase 1 migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, before, after, label):
              p = Path(path)
              text = p.read_text()
              if before not in text:
                  raise SystemExit(f"missing {label} in {path}")
              p.write_text(text.replace(before, after, 1))

          # storage.js
          path = Path('src/utils/storage.js')
          text = path.read_text()
          before = '} from "./templateUtils.js";\n'
          after = '''} from "./templateUtils.js";
          import {
            MAINTENANCE_COMPLETION_SOURCES,
            MAINTENANCE_EFFORTS,
            MAINTENANCE_FREQUENCY_MODES,
            deriveLegacyMaintenanceCompletions,
            normalizeMaintenanceCompletions,
            normalizeMaintenanceTaskList
          } from "./maintenanceTasks.js";
          '''
          if before not in text: raise SystemExit('storage import anchor missing')
          text = text.replace(before, after, 1)
          text = text.replace('export const CURRENT_BACKUP_VERSION = 3;', 'export const CURRENT_BACKUP_VERSION = 4;', 1)

          before = '''export function normalizeAppState(value) {
            if (!isPlainObject(value)) return createLegacyState();
          '''
          after = '''function normalizeMaintenanceTasksByTemplate(value, templates) {
            const saved = isPlainObject(value) ? value : {};
            return Object.fromEntries(
              templates.map((template) => {
                const existing = Array.isArray(saved[template.id])
                  ? normalizeMaintenanceTaskList(saved[template.id], template.zones)
                  : [];
                const defaults = normalizeMaintenanceTaskList(undefined, template.zones);
                const existingIds = new Set(existing.map((task) => task.id));
                return [
                  template.id,
                  [...existing, ...defaults.filter((task) => !existingIds.has(task.id))]
                ];
              })
            );
          }

          function templatesWithMaintenanceTasks(templates, maintenanceTasksByTemplate) {
            return templates.map((template) => ({
              ...template,
              maintenanceTasks: maintenanceTasksByTemplate[template.id] || []
            }));
          }

          export function normalizeAppState(value) {
            if (!isPlainObject(value)) return normalizeAppState(createLegacyState());
          '''
          if before not in text: raise SystemExit('normalizeAppState anchor missing')
          text = text.replace(before, after, 1)

          before = '''  const todayTasksByDate = normalizeTodayTasksByDate(
            value.todayTasksByDate,
            activeTemplate,
            dailyRuleCompletions,
            value.dashboardTodos,
            appSettings
          );

            return {'''
          # tolerate the actual two-space indentation on return
          if before not in text:
              before = '''  const todayTasksByDate = normalizeTodayTasksByDate(
            value.todayTasksByDate,
            activeTemplate,
            dailyRuleCompletions,
            value.dashboardTodos,
            appSettings
          );

          return {'''
          after = '''  const todayTasksByDate = normalizeTodayTasksByDate(
            value.todayTasksByDate,
            activeTemplate,
            dailyRuleCompletions,
            value.dashboardTodos,
            appSettings
          );
            const maintenanceTasksByTemplate = normalizeMaintenanceTasksByTemplate(
              value.maintenanceTasksByTemplate,
              templates
            );
            const maintenanceTemplates = templatesWithMaintenanceTasks(
              templates,
              maintenanceTasksByTemplate
            );
            const maintenanceCompletions = hasOwn(value, "maintenanceCompletions")
              ? normalizeMaintenanceCompletions(value.maintenanceCompletions, maintenanceTemplates)
              : deriveLegacyMaintenanceCompletions({
                  templates: maintenanceTemplates,
                  activeTemplateId,
                  todayTasksByDate,
                  history
                });

          return {'''
          if before not in text: raise SystemExit('today normalization anchor missing')
          text = text.replace(before, after, 1)
          before = '''    todayTasksByDate,
            dashboardTodos: normalizeDashboardTodos(value.dashboardTodos),'''
          if before not in text:
              before = '''    todayTasksByDate,
            dashboardTodos: normalizeDashboardTodos(value.dashboardTodos),'''.replace('            dashboard', '    dashboard')
          after = '''    todayTasksByDate,
            maintenanceTasksByTemplate,
            maintenanceCompletions,
            dashboardTodos: normalizeDashboardTodos(value.dashboardTodos),'''
          if before not in text: raise SystemExit('state return anchor missing')
          text = text.replace(before, after, 1)
          text = text.replace(
              '  const state = saved ? normalizeAppState(saved) : createLegacyState();',
              '  const state = saved\n    ? normalizeAppState(saved)\n    : normalizeAppState(createLegacyState());',
              1
          )
          text = text.replace(
              '  "todayTasksByDate",\n  "dashboardTodos",',
              '  "todayTasksByDate",\n  "maintenanceTasksByTemplate",\n  "maintenanceCompletions",\n  "dashboardTodos",',
              1
          )

          validator_anchor = 'const CURRENT_STATE_FIELDS = ['
          validators = '''const CURRENT_MAINTENANCE_TASK_FIELDS = [
            "id",
            "catalogId",
            "title",
            "room",
            "estimatedMinutes",
            "stage",
            "frequencyMode",
            "intervalDays",
            "weekdays",
            "effort",
            "enabled",
            "source"
          ];

          function isValidMaintenanceTaskBackupShape(task) {
            return (
              hasOwnFields(task, CURRENT_MAINTENANCE_TASK_FIELDS) &&
              isNonEmptyString(task.id) &&
              (task.catalogId === null || isNonEmptyString(task.catalogId)) &&
              isNonEmptyString(task.title) &&
              isNonEmptyString(task.room) &&
              typeof task.estimatedMinutes === "number" &&
              Number.isInteger(task.estimatedMinutes) &&
              task.estimatedMinutes >= 1 &&
              task.estimatedMinutes <= 240 &&
              typeof task.stage === "number" &&
              Number.isInteger(task.stage) &&
              task.stage >= 0 &&
              task.stage <= 100 &&
              MAINTENANCE_FREQUENCY_MODES.includes(task.frequencyMode) &&
              (task.frequencyMode === "on-demand"
                ? task.intervalDays === null
                : typeof task.intervalDays === "number" &&
                  Number.isInteger(task.intervalDays) &&
                  task.intervalDays >= 1 &&
                  task.intervalDays <= 3650) &&
              Array.isArray(task.weekdays) &&
              task.weekdays.every((day) => WEEKDAY_KEYS.includes(day)) &&
              (task.frequencyMode !== "weekdays" || task.weekdays.length > 0) &&
              MAINTENANCE_EFFORTS.includes(task.effort) &&
              typeof task.enabled === "boolean" &&
              ["catalog", "custom"].includes(task.source)
            );
          }

          function isValidMaintenanceTasksByTemplate(value, templates) {
            if (!isPlainObject(value)) return false;
            const templateIds = templates.map((template) => template.id);
            const keys = Object.keys(value);
            if (
              keys.length !== templateIds.length ||
              !keys.every((key) => templateIds.includes(key))
            ) {
              return false;
            }
            return templateIds.every(
              (templateId) =>
                Array.isArray(value[templateId]) &&
                value[templateId].every(isValidMaintenanceTaskBackupShape) &&
                !containsDuplicateIds(value[templateId])
            );
          }

          const CURRENT_MAINTENANCE_COMPLETION_FIELDS = [
            "id",
            "templateId",
            "taskId",
            "completedAt",
            "source",
            "sourceId"
          ];

          function isValidMaintenanceCompletions(value, maintenanceTasksByTemplate) {
            if (!Array.isArray(value) || containsDuplicateIds(value)) return false;
            return value.every((entry) => {
              if (
                !hasOwnFields(entry, CURRENT_MAINTENANCE_COMPLETION_FIELDS) ||
                !isNonEmptyString(entry.id) ||
                !isNonEmptyString(entry.templateId) ||
                !isNonEmptyString(entry.taskId) ||
                !normalizeDateString(entry.completedAt) ||
                new Date(entry.completedAt).getTime() > Date.now() + MAX_CLOCK_SKEW_MS ||
                !MAINTENANCE_COMPLETION_SOURCES.includes(entry.source) ||
                !(entry.sourceId === null || isNonEmptyString(entry.sourceId))
              ) {
                return false;
              }
              return Boolean(
                maintenanceTasksByTemplate[entry.templateId]?.some(
                  (task) => task.id === entry.taskId
                )
              );
            });
          }

          const CURRENT_STATE_FIELDS = ['''
          if validator_anchor not in text: raise SystemExit('state field anchor missing')
          text = text.replace(validator_anchor, validators, 1)

          before = '''  if (!isValidTodayTasksByDate(data.todayTasksByDate)) {
            return "Current backup contains invalid or incomplete Today task data.";
          }
          '''
          after = '''  if (!isValidTodayTasksByDate(data.todayTasksByDate)) {
            return "Current backup contains invalid or incomplete Today task data.";
          }
            if (!isValidMaintenanceTasksByTemplate(data.maintenanceTasksByTemplate, data.templates)) {
              return "Current backup contains invalid or incomplete cleaning-task configuration.";
            }
            if (!isValidMaintenanceCompletions(data.maintenanceCompletions, data.maintenanceTasksByTemplate)) {
              return "Current backup contains invalid cleaning-task completion history.";
            }
          '''
          if before not in text: raise SystemExit('today validation anchor missing')
          text = text.replace(before, after, 1)

          before = '''    todayTasksByDate: {},
            dashboardTodos: [],'''
          if before not in text:
              before = '    todayTasksByDate: {},\n    dashboardTodos: [],'
          after = '''    todayTasksByDate: {},
            maintenanceTasksByTemplate: {
              [defaultTemplate.id]: normalizeMaintenanceTaskList(undefined, defaultTemplate.zones)
            },
            maintenanceCompletions: [],
            dashboardTodos: [],'''
          if before not in text: raise SystemExit('fresh reset anchor missing')
          text = text.replace(before, after, 1)
          path.write_text(text)

          # App.jsx
          path = Path('src/App.jsx')
          text = path.read_text()
          text = text.replace(
              'import { mergeHomeRoomsWithZones } from "./utils/homeLibrary.js";\n',
              '''import { mergeHomeRoomsWithZones } from "./utils/homeLibrary.js";
          import {
            findMaintenanceTaskIdForRoutineTask,
            findMaintenanceTaskIdForTodayTask,
            recordMaintenanceCompletion
          } from "./utils/maintenanceTasks.js";
          ''',
              1
          )

          before = '''  function finishSession() {
            const sessionId = appState.activeSession?.id;
            if (!sessionId) return;
            const finishedAt =
              finishRequestTimesRef.current.get(sessionId) || new Date().toISOString();
            finishRequestTimesRef.current.set(sessionId, finishedAt);
            const expectsSummary = appState.activeSession?.routineId !== "daily-rules";
            setAppState((current) => finishSessionState(current, sessionId, finishedAt).state);
            setCompletionSummary(null);
            setPendingCompletionSessionId(expectsSummary ? sessionId : null);
          }'''
          after = '''  function finishSession() {
            const sessionId = appState.activeSession?.id;
            if (!sessionId) return;
            const finishedAt =
              finishRequestTimesRef.current.get(sessionId) || new Date().toISOString();
            finishRequestTimesRef.current.set(sessionId, finishedAt);
            const expectsSummary = appState.activeSession?.routineId !== "daily-rules";
            setAppState((current) => {
              const session = current.activeSession;
              const finished = finishSessionState(current, sessionId, finishedAt).state;
              if (!session || session.id !== sessionId) return finished;
              const template = getTemplateFromState(current);
              const maintenanceTemplate = {
                ...template,
                maintenanceTasks:
                  current.maintenanceTasksByTemplate?.[template.id] || []
              };
              const completedIds = new Set(session.completedTaskIds || []);
              let maintenanceCompletions = current.maintenanceCompletions || [];
              for (const phase of session.routineSnapshot?.phases || []) {
                for (const task of phase.tasks || []) {
                  if (!completedIds.has(task.id)) continue;
                  const maintenanceTaskId = findMaintenanceTaskIdForRoutineTask(
                    maintenanceTemplate,
                    task,
                    phase.title
                  );
                  if (!maintenanceTaskId) continue;
                  maintenanceCompletions = recordMaintenanceCompletion(
                    maintenanceCompletions,
                    {
                      templateId: template.id,
                      taskId: maintenanceTaskId,
                      completedAt: finishedAt,
                      source: "routine",
                      sourceId: `session:${session.id}:${task.id}`
                    }
                  );
                }
              }
              return { ...finished, maintenanceCompletions };
            });
            setCompletionSummary(null);
            setPendingCompletionSessionId(expectsSummary ? sessionId : null);
          }'''
          if before not in text: raise SystemExit('finishSession anchor missing')
          text = text.replace(before, after, 1)

          before = '''  function toggleTodayTask(taskId) {
            const dateKey = getTodayKey();
            setAppState((current) => {
              const tasks = getTodayTasksFromState(current, dateKey).map((task) => {
                if (task.id !== taskId) return task;
                const completed = !task.completed;
                return {
                  ...task,
                  completed,
                  completedAt: completed ? new Date().toISOString() : null
                };
              });
              const next = applyTodayTasksToState(current, dateKey, tasks);
              return markMeaningfulUse(next);
            });
          }'''
          after = '''  function toggleTodayTask(taskId) {
            const dateKey = getTodayKey();
            setAppState((current) => {
              const currentTasks = getTodayTasksFromState(current, dateKey);
              const target = currentTasks.find((task) => task.id === taskId);
              if (!target) return current;
              const completed = !target.completed;
              const completedAt = completed ? new Date().toISOString() : null;
              const tasks = currentTasks.map((task) =>
                task.id === taskId ? { ...task, completed, completedAt } : task
              );
              const template = getTemplateFromState(current);
              const maintenanceTemplate = {
                ...template,
                maintenanceTasks:
                  current.maintenanceTasksByTemplate?.[template.id] || []
              };
              const sourceId = `today:${dateKey}:${taskId}`;
              let maintenanceCompletions = (current.maintenanceCompletions || []).filter(
                (entry) => entry.sourceId !== sourceId
              );
              if (completed) {
                const maintenanceTaskId = findMaintenanceTaskIdForTodayTask(
                  maintenanceTemplate,
                  target
                );
                if (maintenanceTaskId) {
                  maintenanceCompletions = recordMaintenanceCompletion(
                    maintenanceCompletions,
                    {
                      templateId: template.id,
                      taskId: maintenanceTaskId,
                      completedAt,
                      source: "today",
                      sourceId
                    }
                  );
                }
              }
              const next = applyTodayTasksToState(
                { ...current, maintenanceCompletions },
                dateKey,
                tasks
              );
              return markMeaningfulUse(next);
            });
          }'''
          if before not in text: raise SystemExit('toggleTodayTask anchor missing')
          text = text.replace(before, after, 1)

          text = text.replace(
              '      message: "This clears completed sessions but keeps templates and Today tasks.",',
              '      message: "This clears completed sessions and cleaning-task history, but keeps your setup and Today tasks.",',
              1
          )
          text = text.replace(
              '        setAppState((current) => ({ ...current, history: [] }));',
              '''        setAppState((current) => ({
                    ...current,
                    history: [],
                    maintenanceCompletions: []
                  }));''',
              1
          )
          before = '''        setAppState((current) => ({
                  ...current,
                  history: current.history.filter(
                    (entry) => entry.id !== entryId || isDailyRulesHistoryEntry(entry)
                  )
                }));'''
          after = '''        setAppState((current) => {
                  const sessionId = entryId.startsWith("session-history-")
                    ? entryId.slice("session-history-".length)
                    : "";
                  return {
                    ...current,
                    history: current.history.filter(
                      (entry) => entry.id !== entryId || isDailyRulesHistoryEntry(entry)
                    ),
                    maintenanceCompletions: (current.maintenanceCompletions || []).filter(
                      (entry) =>
                        !entry.sourceId?.startsWith(`history:${entryId}:`) &&
                        !(sessionId && entry.sourceId?.startsWith(`session:${sessionId}:`))
                    )
                  };
                });'''
          if before not in text: raise SystemExit('deleteHistoryEntry anchor missing')
          text = text.replace(before, after, 1)
          path.write_text(text)

          # PWA + verifier
          path = Path('public/sw.js')
          text = path.read_text().replace('app-shell-v19', 'app-shell-v20', 1)
          path.write_text(text)

          path = Path('scripts/verify-release.mjs')
          text = path.read_text()
          text = text.replace('/app-shell-v19/', '/app-shell-v20/', 1)
          text = text.replace('The final release candidate must use the Phase 19 app-shell cache boundary.', 'The autopilot upgrade must use the v20 app-shell cache boundary.', 1)
          text = text.replace('assert.equal(CURRENT_BACKUP_VERSION, 3, "Full-backup schema changed unexpectedly.");', 'assert.equal(CURRENT_BACKUP_VERSION, 4, "Full-backup schema changed unexpectedly.");', 1)
          text = text.replace('console.log("- Phase 19 service-worker cache boundary verified");', 'console.log("- autopilot v20 service-worker cache boundary verified");', 1)
          path.write_text(text)

          # New regression suite for the persisted canonical task foundation.
          Path('tests/autopilot-phase-1.test.js').write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";

          import {
            CURRENT_BACKUP_VERSION,
            createFullBackup,
            normalizeAppState,
            resetToFreshState,
            validateFullBackupPayload
          } from "../src/utils/storage.js";
          import {
            createDefaultMaintenanceTasks,
            findMaintenanceTaskIdForTodayTask,
            recordMaintenanceCompletion
          } from "../src/utils/maintenanceTasks.js";
          import { createDefaultTemplate } from "../src/utils/templateUtils.js";

          test("fresh state seeds canonical cleaning tasks for configured rooms", () => {
            const state = resetToFreshState();
            const tasks = state.maintenanceTasksByTemplate[state.activeTemplateId];
            assert.ok(tasks.length > 20);
            assert.ok(tasks.some((task) => task.room === "Kitchen" && task.title === "Wipe kitchen counters"));
            assert.ok(tasks.some((task) => task.room === "Bathroom" && task.title === "Clean the toilet"));
            assert.ok(tasks.every((task) => Number.isInteger(task.estimatedMinutes)));
            assert.ok(tasks.every((task) => ["interval", "weekdays", "on-demand"].includes(task.frequencyMode)));
          });

          test("catalog task IDs are deterministic across fresh generation", () => {
            const template = createDefaultTemplate();
            const first = createDefaultMaintenanceTasks(template.zones);
            const second = createDefaultMaintenanceTasks(template.zones);
            assert.deepEqual(first.map((task) => task.id), second.map((task) => task.id));
          });

          test("v4 full backups require and preserve canonical maintenance state", () => {
            const state = resetToFreshState();
            const backup = createFullBackup(state);
            assert.equal(CURRENT_BACKUP_VERSION, 4);
            assert.equal(backup.version, 4);
            const validated = validateFullBackupPayload(backup);
            assert.equal(validated.ok, true);
            assert.deepEqual(validated.data.maintenanceTasksByTemplate, state.maintenanceTasksByTemplate);
          });

          test("older v3 backups migrate forward without losing their normal app data", () => {
            const state = resetToFreshState();
            const backup = createFullBackup(state);
            backup.version = 3;
            delete backup.data.maintenanceTasksByTemplate;
            delete backup.data.maintenanceCompletions;
            const result = validateFullBackupPayload(backup);
            assert.equal(result.ok, true);
            assert.ok(result.data.maintenanceTasksByTemplate[result.data.activeTemplateId].length > 20);
            assert.ok(Array.isArray(result.data.maintenanceCompletions));
          });

          test("completed legacy Today tasks seed task-level cleaning history conservatively", () => {
            const base = resetToFreshState();
            const dateKey = "2026-08-15";
            const raw = {
              ...base,
              todayTasksByDate: {
                [dateKey]: [
                  {
                    id: "today-kitchen-counter",
                    defaultTaskId: null,
                    text: "Wipe kitchen counters",
                    completed: true,
                    source: "custom",
                    note: "Room: Kitchen",
                    tags: [],
                    routineId: null,
                    routineName: "",
                    originalTaskId: null,
                    createdAt: `${dateKey}T10:00:00.000Z`,
                    completedAt: `${dateKey}T10:04:00.000Z`
                  }
                ]
              }
            };
            delete raw.maintenanceCompletions;
            const normalized = normalizeAppState(raw);
            const tasks = normalized.maintenanceTasksByTemplate[normalized.activeTemplateId];
            const task = tasks.find((item) => item.title === "Wipe kitchen counters" && item.room === "Kitchen");
            assert.ok(task);
            assert.ok(normalized.maintenanceCompletions.some((entry) => entry.taskId === task.id));
          });

          test("Today matching uses explicit room context instead of title-only guesses", () => {
            const template = createDefaultTemplate();
            const maintenanceTasks = createDefaultMaintenanceTasks(template.zones);
            const maintenanceTemplate = { ...template, maintenanceTasks };
            const id = findMaintenanceTaskIdForTodayTask(maintenanceTemplate, {
              text: "Clean the bathroom mirror",
              note: "Room: Bathroom",
              source: "custom"
            });
            assert.equal(id, maintenanceTasks.find((task) => task.title === "Clean the bathroom mirror")?.id);
          });

          test("completion writes replace the same source event instead of double counting it", () => {
            const task = createDefaultMaintenanceTasks([{ name: "Kitchen" }]).find(
              (item) => item.title === "Wipe kitchen counters"
            );
            let entries = recordMaintenanceCompletion([], {
              templateId: "clean30-default",
              taskId: task.id,
              completedAt: "2026-08-15T10:00:00.000Z",
              source: "today",
              sourceId: "today:2026-08-15:counter"
            });
            entries = recordMaintenanceCompletion(entries, {
              templateId: "clean30-default",
              taskId: task.id,
              completedAt: "2026-08-15T10:01:00.000Z",
              source: "today",
              sourceId: "today:2026-08-15:counter"
            });
            assert.equal(entries.length, 1);
            assert.equal(entries[0].completedAt, "2026-08-15T10:01:00.000Z");
          });
          ''')

          print('Phase 1 patch applied')
          PY

      - name: Syntax check
        run: |
          node --check src/utils/maintenanceTasks.js
          node --check src/utils/storage.js
          node --check scripts/verify-release.mjs
          node --check public/sw.js

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "Clean30 Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/utils/storage.js src/utils/maintenanceTasks.js public/sw.js scripts/verify-release.mjs tests/autopilot-phase-1.test.js
          git commit -m "Phase 1: add canonical cleaning task foundation"
          git push origin HEAD:redesign/autopilot-core
