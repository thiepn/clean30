name: Clean30 Autopilot Phase 1 Apply v2

on:
  push:
    branches:
      - redesign/autopilot-core
    paths:
      - .github/workflows/autopilot-phase1-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: redesign/autopilot-core
          fetch-depth: 0

      - name: Apply Phase 1 migration
        run: python scripts/apply-autopilot-phase1.py

      - name: Syntax check
        run: |
          node --check src/utils/maintenanceTasks.js
          node --check src/utils/storage.js
          node --check scripts/verify-release.mjs
          node --check public/sw.js

      - name: Commit migration
        run: |
          git config user.name "Clean30 Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/utils/storage.js src/utils/maintenanceTasks.js public/sw.js scripts/verify-release.mjs tests/autopilot-phase-1.test.js
          git commit -m "Phase 1: add canonical cleaning task foundation"
          git push origin HEAD:redesign/autopilot-core
