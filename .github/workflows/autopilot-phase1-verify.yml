name: Clean30 Autopilot Phase 1 Verify

on:
  push:
    branches:
      - redesign/autopilot-core
    paths:
      - .github/workflows/autopilot-phase1-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: redesign/autopilot-core
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:release
      - run: npm test
      - run: npm run build
      - run: npm run verify:release
      - run: npm run verify:runtime
      - run: node --check public/sw.js
