name: Apply RC1 certification patch

on:
  push:
    branches:
      - redesign/rc1-release-certification

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC1 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Decode and apply reviewed RC1 patch
        shell: bash
        run: |
          base64 --decode .github/rc1.patch.gz.b64 | gzip --decompress > /tmp/clean30-rc1.patch
          echo "f2a6ad6309658b7ed49847199291919c629ff2cfec7b3b8e3010efb177cafa36  /tmp/clean30-rc1.patch" | sha256sum --check --strict
          git apply --check /tmp/clean30-rc1.patch
          git apply /tmp/clean30-rc1.patch
          rm .github/rc1.patch.gz.b64 .github/workflows/apply-rc1.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify RC1 release candidate
        run: npm run verify:release-candidate

      - name: Commit verified RC1 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RC1: certify mobile shell and keyboard behavior"
          git push origin HEAD:${{ github.ref_name }}
