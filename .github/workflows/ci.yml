name: Clean30 CI

on:
  push:
    branches:
      - "redesign/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit release dependencies
        run: npm run audit:release

      - name: Verify personal template export
        run: |
          npm run export:personal-template
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const payload = JSON.parse(readFileSync('local-templates/clean30-personal-30m2-template.json', 'utf8')); if (payload.app !== 'Clean30' || payload.type !== 'template' || payload.version !== 2 || !payload.template?.routines?.length) process.exit(1);"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify release artifacts
        run: npm run verify:release

      - name: Check service worker syntax
        run: node --check public/sw.js
